<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoreTop</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        },
      },
    }
  </script>
</head>

<!-- Fundo escuro -->
<body class="bg-[#0b0514] text-white font-sans antialiased min-h-screen">

  <!-- Navbar -->
  <nav class="w-full h-20 border-b border-white/5 fixed top-0 left-0 z-50 px-6 md:px-12 bg-[#0b0514]">
    <div class="flex justify-between items-center h-full max-w-6xl mx-auto">
      <div class="flex items-center gap-2">
        <span class="w-6 h-6 rounded bg-purple-600 flex items-center justify-center font-bold text-xs">C</span>
        <span class="font-bold text-base tracking-tight"><a href="#">CoreTop</a></span>
      </div>

      <div class="hidden md:flex items-center">
        <ul class="flex justify-between gap-8 text-xs font-medium tracking-wide">
          <li><a href="" class="text-gray-400 hover:text-white transition-colors">Shop</a></li>
          <li><a href="" class="text-gray-400 hover:text-white transition-colors">Collections</a></li>
          <li><a href="" class="text-gray-400 hover:text-white transition-colors">Craft</a></li>
          <li><a href="" class="text-gray-400 hover:text-white transition-colors">Contact</a></li>
        </ul>
      </div>

      <div class="flex items-center gap-5">
        <a href="" class="text-gray-400 hover:text-white text-xs font-medium transition-colors">
          Cart
        </a>
        <a href="">
          <button class="bg-purple-600 text-white font-medium py-2 px-4 rounded text-xs hover:bg-purple-700 transition-colors">
            Shop now
          </button>
        </a>
      </div>
    </div>
  </nav>

  <div class="h-20"></div>

  <!-- Hero Section -->
  <main class="max-w-6xl mx-auto px-6 md:px-12 py-16 md:py-24 grid-cols-1 lg:grid-cols-2 gap-12 items-center">
    <div class="flex flex-col gap-6">
      <span class="text-xs font-semibold tracking-wider text-purple-400 uppercase">
        New 2026 lineup - Limited drop
      </span>
      <h1 class="text-4xl md:text-5xl font-bold tracking-tight leading-tight">
        Laptops for <span class="text-purple-300">creators</span> who refuse to compromise.
      </h1>
      <p class="text-gray-400 text-sm md:text-base max-w-md leading-relaxed font-light">
        CoreTop engineers ultralight machines in obsidian aluminum and violet anodized finishes - built to outpace every workflow you throw at them.
      </p>
      <div class="flex items-center gap-4 pt-2">
        <button class="bg-purple-600 hover:bg-purple-700 text-white font-medium py-2.5 px-5 rounded text-xs transition-colors">
          Explore the lineup
        </button>
        <button class="bg-transparent hover:bg-white/5 border border-white/20 text-white font-medium py-2.5 px-5 rounded text-xs transition-colors">
          View specs
        </button>
      </div>
      <div>
        
      </div>
    </div>
  </main>
</body>

</html>
